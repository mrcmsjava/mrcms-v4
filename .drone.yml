kind: pipeline
type: docker
name: default

steps:
  - name: resource fix
    image: nas.mrcms.cn:8082/wuweiit/alpine:3.20.2
    pull: if-not-exists
    volumes:
      - name: ssh
        path: /root/.ssh
    commands:
      - chmod 600 /root/.ssh/id_rsa
    when:
      branch:
        - release

  - name: build-jar
    #image: nas.mrcms.cn:8082/maven:3.8.6-jdk-8-slim
    image: bellsoft/liberica-native-image-kit-container:jdk-17-nik-23.0.9-musl
    pull: if-not-exists # 如果镜像不存在则拉取,免去每次都要重新下载
    volumes:
      - name: mavenRep
        path: /root/.m2
      - name: maven
        path: /drone/maven
    commands:
      - echo 构建号：${DRONE_BRANCH}
      - echo "识别环境 决定资源"
      - if [ "${DRONE_BRANCH}" != "prod" ]; then echo 'prod' ;fi
      - ls /drone/maven
      - chmod +x /drone/maven/bin/mvn
      - /drone/maven/bin/mvn package -DskipTests=true -Dmaven.javadoc.skip=true -U -Pdev
    when:
      branch:
        - dev


  - name: scp jar to ${DRONE_BRANCH}
    image: nas.mrcms.cn:8082/appleboy/drone-scp
    pull: if-not-exists # 如果镜像不存在则拉取,免去每次都要重新下载
    #    environment:
    #      SSH_KEY_PATH: /root/.ssh/id_rsa
    volumes:
      - name: ssh
        path: /root/.ssh
    settings:
      host: 192.168.1.6
      username: root
      key:
        from_secret: ssh_rsa
      port: 22
      strip_components: 2
      target: /opt/baota/www/wwwroot/open.joggle.cn/mrcmsv4/
      source: ./target/dist
    when:
      branch:
        - dev



  - name: build-native
    #image: nas.mrcms.cn:8082/maven:3.8.6-jdk-8-slim
    image: bellsoft/liberica-native-image-kit-container:jdk-17-nik-23.0.9-musl
    pull: if-not-exists # 如果镜像不存在则拉取,免去每次都要重新下载
    volumes:
      - name: mavenRep
        path: /root/.m2
      - name: maven
        path: /drone/maven
    commands:
      - echo 构建号：${DRONE_BRANCH}
      - echo "识别环境 决定资源"
      - if [ "${DRONE_BRANCH}" != "prod" ]; then echo 'prod' ;fi
      - ls /drone/maven
      - chmod +x /drone/maven/bin/mvn
      - /drone/maven/bin/mvn package -DskipTests=true -Dmaven.javadoc.skip=true -U -Pnative
    when:
      branch:
        - native

  - name: scp native to ${DRONE_BRANCH}
    image: nas.mrcms.cn:8082/appleboy/drone-scp
    pull: if-not-exists # 如果镜像不存在则拉取,免去每次都要重新下载
#    environment:
#      SSH_KEY_PATH: /root/.ssh/id_rsa
    volumes:
      - name: ssh
        path: /root/.ssh
    settings:
      host: 192.168.1.6
      username: root
      key:
        from_secret: ssh_rsa
      port: 22
      strip_components: 2
      target: /opt/baota/www/wwwroot/open.joggle.cn/mrcmsv4/
      source: ./native/
    when:
      branch:
        - native


  - name: image
    image: plugins/docker
    pull: if-not-exists # 如果镜像不存在则拉取,免去每次都要重新下载
    volumes:
      - name: dockerSock
        path: /var/run/docker.sock
    settings:
      insecure: false
      registry: nas.mrcms.cn:8083
      mirror: https://dkwe3jow.mirror.aliyuncs.com
      storage_path: /docker
      dockerfile: Dockerfile
      build_args: JAR_FILE=./native/
      username:
        from_secret: registry_nexus_username
      password:
        from_secret: registry_nexus_password
      repo: nas.mrcms.cn:8083/wuweiit/mrcms
      tags:
        - ${DRONE_BUILD_NUMBER}
    when:
      branch:
        - native-release

volumes:
  - name: ssh
    host:
      path: /root/.ssh
  - name: kube
    host:
      path: /root/.kube
  - name: mavenRep
    host:
      path: /opt/data/drone/.m2
  - name: maven
    host:
      path: /opt/apps/drone/build/apache-maven-3.9.11
  - name: dockerSock
    host:
      path: /var/run/docker.sock
trigger:
  event:
    include:
      - push
      - custom
  branch:
    - dev